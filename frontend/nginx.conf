server {
    listen 80;

    # SPA: estáticos, con fallback a index.html para las rutas del router
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Todo lo que llegue a /api se reenvía al backend por la red interna de compose.
    # El nombre 'backend' resuelve al servicio homónimo — solo válido DENTRO de la red
    # de compose (no en el browser). Al ser same-origin, además evita CORS.
    #
    # El nombre va en VARIABLE: con nombre directo, nginx lo resuelve al arrancar y
    # si el backend todavía no existe se niega a levantar ("host not found in
    # upstream"). Con variable, resuelve recién cuando llega un pedido.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:8080;

    location /api/ {
        proxy_pass $backend_api;
    }
}
