services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: habits
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
    image: ghcr.io/lorenzogalaverna/habit-tracker-backend:v0.1.1     # ← antes: build: ./backend
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD}@db:5432/habits"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/lorenzogalaverna/habit-tracker-frontend:v0.1.1    # ← antes: build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
